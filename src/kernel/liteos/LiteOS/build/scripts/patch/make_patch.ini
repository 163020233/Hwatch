[BASICINFO]

;===============================================================
;文件类型 
;PatchType=SP：文件为静态补丁
;同时为了与原来兼容，如果这个项为空"PatchType="或这项没有都表示静态补丁，其他的配置报错。
PatchType=SP

;===============================================================
;补丁文件名前一部分名称，如果配置LITE，且是静态补丁，则文件名LITESP000X.pat
;总文件名不能大于256字节
;支持SP
PatchFilePre=LITE

;===============================================================
;默认的补丁号，如果没有-N指定会使用此配置,做补丁成功后这个值会变成下一个补丁单元
;支持SP
DefaultPatchNo=1

;===============================================================
;每个补丁单元最大支持的打补丁函数个数
;支持SP
MaxFuncInAUnit=20

;===============================================================
;补丁代码段内存地址配置
PatchTextStartAddr=0x101a200000
PatchTextAreaLength=0x1000
PatchTextAreaAvailableLength=0x1000
;共享数据段长度必须是Cache Line对齐
PatchShareDataStart=0x101a201000
PatchShareDataAreaLength=0x1000
PatchShareDataAreaAvailableLength=0x1000

;===============================================================
;image的路径
;支持SP
SymFileBase=./vs_server

;===============================================================
;补丁版本描述，固定写C
;支持SP
PatchFlag=C

;===============================================================
;程序类型，固定写58
;支持SP
ProgType=58

[OUTFILE]
