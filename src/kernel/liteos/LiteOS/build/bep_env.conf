[timestamp]
bep_timestamp=2022-04-29,23:00:25
second=2022-04-29,23:00:25
third=2022-04-29,23:00:25
################################################################################
# --- You can specify the value of keyword in section user_define_data.
# --- If not set, bep script will use the default value. e.g. BEP_HOSTNAME = buildhost,BEP_INODE = 1.
# --- You can unset BEP_HOSTNAME to get the real hostname.
################################################################################

[user_define_data]
BEP_HOSTNAME=buildhost
BEP_UID=
BEP_GID=
BEP_INODE=1
BEP_DEV_ID=
BEP_R_DEV_ID=

[trace_define_data]
# init bepkit trace sqlite3 datebase when exec source ./bep_env.sh -s bep_env.conf.
# BEP_TRACE_ENABLE=yes
# BEP_TRACE_OUTPUT must be an absolute path.
#BEP_TRACE_OUTPUT=/tmp/secBepkit-2.1.0/bepkit_trace.db
# when use redis, the following need to be configure
# trace hfile option: m(-M), mm(-MM), no
#BEP_TRACE_HDEPS=
#BEP_TRACE_MAP=cmd1:map1 cmd2:map2
#BEP_TRACE_WHITELIST=
# the buildlist like gcc g++ xg++ ld cc c++ cc1 cc1plus as collect2
#BEP_TRACE_BUILDLIST=
#BEP_TRACE_BUILD_TOOLNAME=
#BEP_TRACE_OUTPUT_TOOLNAME=


################################################################################
# --- bep_time_blacklist have priority over whitelist.
################################################################################
[bep_time_blacklist]
BEP_TIMELIST=clang-15 clang-12 clang-8 clang adduser ant ar bash bzip2 cc1 cc1plus chpasswd cpio gpg guile gzip hpmimage java lzma mkfs.cramfs mkfs.ext2 mkfs.jffs2 mkimage makepatch mksquashfs passwd ranlib rpmbuild strip tar useradd xz zip
BEP_CGTLIST=bash date file gpg gzip hpmimage ld mkfs.cramfs mkfs.jffs2 mkimage postmap python rpmdb sh tar zip
BEP_FILE_TIME_LIST=clang-15 clang-12 clang-8 clang ar as awk bash cat cc1 cc1plus chmod cp cpio file grep gzip hpmimage java ld lzma mkfs.cramfs mkfs.jffs2 mkimage postmap python2.7 python3.7 rpmbuild rpmdb sh strip tar zip

################################################################################
# --- the program of whitelist will cause compile block or break.
################################################################################
[whitelist]
#BEP_WHITELIST=be cvs git git-merge gpg-agent ls make ntpdate perl python2.7.real rsync sed svn test zip

################################################################################
# --- BEP_PRO_TIMES_LIST is equal to BEP_TIMESLIST in 1.1.x version
# --- BEP_DIRLIST is used to handle differences in file order, which equals to BEP_BLACKLIST in 1.1.X version
# --- BEP_DIRONCELIST is used to reinforce BEP_DIRLIST, it will only traverse once in this list
# --- BEP_RANDOMLIST is set for random source, including rand(), random(), /dev/random and /dev/urandom.
################################################################################
[blacklist]
BEP_GTDLIST=clang-15 clang-12 clang-8 clang EMAP_Tool bash cc1 createbin date doxygen file g++ gpg gs gzip hpmimage iscsi-name label_bin ld mkfs.cramfs mkfs.ext2  mkfs.jffs2 mkimage node postmap python rpmdb sh tar zip
BEP_PRO_TIMES_LIST=gs
BEP_DIRLIST=ar depmod fdupes gpg gtk-update-icon-cache make miniperl miniruby mksquashfs mksquashfs64 perl php python python2 python3 rcc tar texi2html zip
BEP_DIRONCELIST=ls find tar zip mksquashfs
BEP_NFTWLIST=jevents
BEP_UIDLIST=EMAP_Tool ar gzip tar zip mkfs.ext2
BEP_DEVIDLIST=stat tar gzip rpmbuild
BEP_RANDOMLIST=chpasswd g++ gcc gpg guile iscsi-name java mksquashfs mksquashfs64 passwd perl postmap rpmdb tar zip
BEP_NAMELIST=configure emacs hostname perl python python3 rpmbuild uname uname.bin
BEP_DIRSIZELIST=

[hash_seed]
PERL_HASH_SEED=0
PYTHONHASHSEED=0

[timezone]
TZ=Asia/Shanghai
#SOURCE_DATE_EPOCH=yes

################################################################################
# --- LC_ALL. This variable overrides the value of LANG and any other LC_ variable specifying a locale category.
# --- To support chinese env:
# --- set LC_ALL to "en_US-UTF-8" or unset LC_ALL and set LC_CTYPE to "en_US-UTF-8".
################################################################################
[locale]
LC_ALL=C
#LC_CTYPE="en_US-UTF-8"

[sysinfo]
#BEP_SYSINFOLIST=
#BEP_SYSINFO_UPTIME=
#BEP_SYSINFO_LOADS=
#BEP_SYSINFO_TOTALRAM=
#BEP_SYSINFO_FREERAM=
#BEP_SYSINFO_SHAREDRAM=
#BEP_SYSINFO_BUFFERRAM=
#BEP_SYSINFO_TOTALSWAP=
#BEP_SYSINFO_FREESWAP=
#BEP_SYSINFO_PROCS=
#BEP_SYSINFO_TOTALHIGH=
#BEP_SYSINFO_FREEHIGH=
#BEP_SYSINFO_MEN_UNIT=

[random_replay]
# record and replay the random value used in AI project, the default output name is bep_random_{process}
#BEP_RANDOM_RECORD_OUTPUT=/tmp/secBepkit-2.1.0/bep_random
#BEP_REPLAYLIST=
