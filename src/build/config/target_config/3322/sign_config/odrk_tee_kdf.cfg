# 1 Hi3322
ChipName=1

# 1 ODRK_TEE
# 2 ODRK_REE
# 3 USER_TEE
# 4 USER_REE
# 5 BOOT_TEE
# 6 BOOT_REE
KeyType=1

# 1 AES+PBKDF2-SHA256
# 2 SM4+PBKDF2-SM3
AlgSel=1

# Filled in a 28-bytes hex string as Salt.
# For example: Salt=000102030405060708090a0b0c0d0e0f101112131415161718191a1b
Salt=

# Filled in a 16-bytes hex string as OEMRootKey.
# For example: OEMRootKey=000f0e0d0c0b0a090807060504030201
OEMRootKey=

# Output binary file path
Output=./odrk_tee.bin

