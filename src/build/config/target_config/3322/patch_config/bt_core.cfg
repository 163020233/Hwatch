[Patch Info]
Device_Code_Version = Version1

Patch_Cpu_Core = BT_CORE

Patch_File_Address  = 0x00000000

# patch_remap table 在bin文件中的偏移地址
Patch_TBL_Address   = 0x5F0

# patch_remap table 实际的运行地址; 须 1K 对齐;
Patch_TBL_Run_Address  = 0x400

# 1a21固定配置为4, remap_table存函数地址, 无长短跳转之分
Table_Max_Size         = 4
Table_Reg_Size         = 4

# 配置为 function, remap存函数地址,
# 配置为 instruction, remap存跳转指令
Table_Remap_Type       = function

# patch 数量 = 指令 patch 的数量(128) + 数据 patch 的数量(2)
# 注意: drivers\chips\3322\patch\flash_patch.h 中的 RISCV32_PATCH_CMP_REG_NUM 宏单指 指令 patch 的数量
#       main.c 中的 PATCH_NUM 宏指 指令 patch + 数据 patch 的数量
TABLE_REG_CONUT        = 130

[ROM Info]
ROM_Address        = 0x1B0000
ROM_Size           = 0x70000

[Output Info]
CMP_Bin_File        = cmp.bin
TBL_Bin_File        = tbl.bin
RW_Bin_File         = patch.bin

